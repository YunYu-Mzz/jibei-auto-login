[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "power-login"
version = "0.1.0"
description = "电力交易平台浏览器登录与短信验证码读取"
requires-python = ">=3.9"
dependencies = ["playwright>=1.40", "numpy>=1.23", "opencv-python>=4.8"]

[tool.setuptools.packages.find]
include = ["power_login*", "solver*"]
